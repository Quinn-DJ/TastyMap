name: TastyMap

options:
  bundleIdPrefix: com.quinn
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  TastyMap:
    type: application
    platform: auto
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: TastyMap
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quinn.TastyMap
        PRODUCT_NAME: TastyMap
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: TastyMap
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "TastyMap 使用你的位置来显示附近收藏和地图位置。"
        INFOPLIST_KEY_NSLocationUsageDescription: "TastyMap 使用你的位置来显示附近收藏和地图位置。"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: true
    scheme:
      gatherCoverageData: false
      testTargets:
        - TastyMapTests

  TastyMapTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TastyMapTests
    dependencies:
      - target: TastyMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quinn.TastyMapTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TastyMap.app/Contents/MacOS/TastyMap"
        BUNDLE_LOADER: "$(TEST_HOST)"
